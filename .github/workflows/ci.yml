name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2:
        description: Run the frozen model-free E2 baseline after validation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.changes.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check CI routing regressions (standard library only)
        run: python -m unittest discover -s tests -p test_ci_scope.py -v
      - name: Select validation scope and check changed prose encoding/whitespace
        id: changes
        run: python scripts/ci_scope.py

  validate-linux:
    needs: scope
    # Keep existing required checks red if the scope/fast checks fail.
    if: ${{ always() && (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'maintenance')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require successful scope checks
        if: ${{ needs.scope.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Install harness
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check ordinary R12 material intent controls (no engine)
        run: dotnet run --project experiments/nu-r12-material-intent/R12MaterialIntent.fsproj -c Release --no-launch-profile --artifacts-path "${{ runner.temp }}/r12-material-intent"
      - name: Check H0 model-free source fixture
        run: python scripts/h0_check.py --output-dir results/h0-linux
      - name: Audit H1/H2 requests and trusted semantic faults (no model)
        run: |
          python scripts/h_check.py --permit-activation --output-dir results/h1-h2-linux
          python scripts/h_check.py --permit-activation --build-fixtures --output-dir results/h1-h2-fixtures-linux
      - name: Check E3a review packet and trusted model-free fixtures
        run: python scripts/e3a_check.py --build-fixtures --output results/e3a-review-fixtures-linux.json
      - name: Check maintenance simulation trusted fixtures
        run: python scripts/maintenance_check.py --build-fixtures --audit-failures --output-dir results/maintenance-sim-linux
      - name: Check E3a sandbox on an explicitly non-experimental SDK fixture
        run: |
          docker pull mcr.microsoft.com/dotnet/sdk:10.0.302@sha256:72dd743782f2ae7e5476fd64f6a460045e3998dc862218b80e6944cba79a01b0
          python scripts/e3a_sandbox_check.py --ci-sdk-fixture --output results/e3a-sandbox-ci-fixture.json
      - name: Check H1/H2 on the non-experimental SDK fixture (no model)
        run: |
          fixture_image_id="$(docker image inspect mcr.microsoft.com/dotnet/sdk:10.0.302@sha256:72dd743782f2ae7e5476fd64f6a460045e3998dc862218b80e6944cba79a01b0 --format '{{.Id}}')"
          python scripts/h_check.py --permit-activation --sandbox --fixture-image-id "$fixture_image_id" --output-dir results/h1-h2-sandbox-linux
      - name: Environment check
        run: python scripts/ise.py doctor --strict
      - name: Validate matched benchmark snapshots
        run: python scripts/ise.py validate
      - name: Check C3 representation artifacts
        run: python scripts/ise.py representation check
      - name: Check frozen Workstream E2 definition
        run: python scripts/ise.py --manifest benchmarks/successor/manifest.json e2 check --definition protocols/workstream-e2-toolchain-v1/definition.json
      - name: Check frozen Workstream E2a definition
        run: python scripts/ise.py --manifest benchmarks/successor/manifest.json e2a check --definition protocols/workstream-e2a-host-aligned-v1/definition.json --inventory protocols/workstream-e2a-host-aligned-v1/inventory.json --e2-definition protocols/workstream-e2-toolchain-v1/definition.json
      - name: Validate difficulty-v1 protocol definition
        run: python scripts/ise.py protocol validate --definition protocols/difficulty-v1/definition.json
      - name: Validate Workstream D family and child definitions
        run: |
          python scripts/ise.py protocol family-validate --definition protocols/workstream-d-language-v2/definition.json
          python scripts/ise.py protocol validate --definition protocols/workstream-d-language-v2/h.json
          python scripts/ise.py protocol validate --definition protocols/workstream-d-language-v2/m.json
          python scripts/ise.py protocol validate --definition protocols/workstream-d-language-v2/l.json
      - name: Validate C3 descriptive treatment
        run: python scripts/ise.py --manifest benchmarks/successor/representation-v1/descriptive.manifest.json validate
      - name: Validate C3 deterministic treatment
        run: python scripts/ise.py --manifest benchmarks/successor/representation-v1/deterministic.manifest.json validate
      - name: Run scripted chain matrix
        run: python scripts/ise.py matrix --agent scripted --output results/ci
      - name: Summarize
        run: python scripts/ise.py summarize results/ci --json > results/ci-summary.json
      - name: Build container
        run: docker build --tag interactive-software-evolution:ci .
      - name: Validate through container entrypoint
        run: docker run --rm interactive-software-evolution:ci validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-results-linux
          path: results/
          if-no-files-found: warn

  validate-windows:
    needs: scope
    if: ${{ always() && (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'maintenance')) }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Require successful scope checks
        if: ${{ needs.scope.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Install harness
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check ordinary R12 material intent controls (no engine)
        run: dotnet run --project experiments/nu-r12-material-intent/R12MaterialIntent.fsproj -c Release --no-launch-profile --artifacts-path "${{ runner.temp }}/r12-material-intent"
      - name: Check H0 model-free source fixture
        run: python scripts/h0_check.py --output-dir results/h0-windows
      - name: Audit H1/H2 requests and trusted semantic faults (no model)
        run: |
          python scripts/h_check.py --permit-activation --output-dir results/h1-h2-windows
          python scripts/h_check.py --permit-activation --build-fixtures --output-dir results/h1-h2-fixtures-windows
      - name: Check E3a review packet and trusted model-free fixtures
        run: python scripts/e3a_check.py --build-fixtures --output results/e3a-review-fixtures-windows.json
      - name: Check maintenance simulation trusted fixtures
        run: python scripts/maintenance_check.py --build-fixtures --audit-failures --output-dir results/maintenance-sim-windows
      - name: Environment check
        run: python scripts/ise.py doctor --strict
      - name: Validate matched benchmark snapshots
        run: python scripts/ise.py validate
      - name: Check C3 representation artifacts
        run: python scripts/ise.py representation check
      - name: Check frozen Workstream E2 definition
        run: python scripts/ise.py --manifest benchmarks/successor/manifest.json e2 check --definition protocols/workstream-e2-toolchain-v1/definition.json
      - name: Check frozen Workstream E2a definition
        run: python scripts/ise.py --manifest benchmarks/successor/manifest.json e2a check --definition protocols/workstream-e2a-host-aligned-v1/definition.json --inventory protocols/workstream-e2a-host-aligned-v1/inventory.json --e2-definition protocols/workstream-e2-toolchain-v1/definition.json
      - name: Validate difficulty-v1 protocol definition
        run: python scripts/ise.py protocol validate --definition protocols/difficulty-v1/definition.json
      - name: Validate Workstream D family and child definitions
        run: |
          python scripts/ise.py protocol family-validate --definition protocols/workstream-d-language-v2/definition.json
          python scripts/ise.py protocol validate --definition protocols/workstream-d-language-v2/h.json
          python scripts/ise.py protocol validate --definition protocols/workstream-d-language-v2/m.json
          python scripts/ise.py protocol validate --definition protocols/workstream-d-language-v2/l.json
      - name: Validate C3 descriptive treatment
        run: python scripts/ise.py --manifest benchmarks/successor/representation-v1/descriptive.manifest.json validate
      - name: Validate C3 deterministic treatment
        run: python scripts/ise.py --manifest benchmarks/successor/representation-v1/deterministic.manifest.json validate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e3a-review-fixtures-windows
          path: |
            results/e3a-review-fixtures-windows.json
            results/h0-windows/
            results/h1-h2-windows/
            results/h1-h2-fixtures-windows/
            results/maintenance-sim-windows/
          if-no-files-found: warn

  maintenance:
    needs: scope
    if: ${{ needs.scope.outputs.scope == 'maintenance' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Install harness
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check maintenance simulation trusted fixtures
        run: python scripts/maintenance_check.py --build-fixtures --audit-failures --output-dir results/maintenance-sim
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-${{ matrix.os }}
          path: results/maintenance-sim/
          if-no-files-found: warn

  e2-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_e2 }}
    needs: [validate-linux, validate-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact-commit E2 image
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/e2/cache" "$RUNNER_TEMP/e2/raw" "$RUNNER_TEMP/e2/report" "$RUNNER_TEMP/e2/work"
          docker build \
            --iidfile "$RUNNER_TEMP/e2/image-id.txt" \
            --tag "interactive-software-evolution:e2-${GITHUB_SHA}" \
            .
      - name: Preseed the fixed NuGet package cache
        shell: bash
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            --env DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            --env DOTNET_NOLOGO=1 \
            --env NUGET_PACKAGES=/e2/cache \
            --volume "$RUNNER_TEMP/e2/cache:/e2/cache" \
            "interactive-software-evolution:e2-${GITHUB_SHA}" \
            -c 'dotnet restore benchmarks/successor/repos/fsharp/v0/OrderFlow.fsproj --nologo && dotnet restore benchmarks/successor/repos/csharp/v0/OrderFlow.csproj --nologo'
      - name: Run frozen E2 baseline without external networking
        shell: bash
        run: |
          image_id="$(cat "$RUNNER_TEMP/e2/image-id.txt")"
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --cpus 2 \
            --memory 6g \
            --memory-swap 6g \
            --env TMPDIR=/e2/work \
            --volume "$RUNNER_TEMP/e2/cache:/e2/cache:ro" \
            --volume "$RUNNER_TEMP/e2/raw:/e2/raw" \
            --volume "$RUNNER_TEMP/e2/report:/e2/report" \
            --volume "$RUNNER_TEMP/e2/work:/e2/work" \
            "interactive-software-evolution:e2-${GITHUB_SHA}" \
            --manifest benchmarks/successor/manifest.json \
            e2 run \
            --definition protocols/workstream-e2-toolchain-v1/definition.json \
            --runner-git-sha "$GITHUB_SHA" \
            --container-image-id "$image_id" \
            --package-cache /e2/cache \
            --raw-output /e2/raw \
            --output-json /e2/report/report.json \
            --output-markdown /e2/report/report.md
      - name: Audit report against raw evidence
        shell: bash
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env TMPDIR=/e2/work \
            --volume "$RUNNER_TEMP/e2/raw:/e2/raw:ro" \
            --volume "$RUNNER_TEMP/e2/report:/e2/report:ro" \
            --volume "$RUNNER_TEMP/e2/work:/e2/work" \
            "interactive-software-evolution:e2-${GITHUB_SHA}" \
            --manifest benchmarks/successor/manifest.json \
            e2 audit \
            --definition protocols/workstream-e2-toolchain-v1/definition.json \
            --report /e2/report/report.json \
            --raw-output /e2/raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workstream-e2-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/e2/image-id.txt
            ${{ runner.temp }}/e2/raw/
            ${{ runner.temp }}/e2/report/
          if-no-files-found: warn
          retention-days: 30
